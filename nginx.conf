server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ensure ES module scripts (.mjs) are served with a JS MIME type.
    # Browsers enforce strict MIME checking for module scripts and will
    # refuse to execute pdf.worker.min-*.mjs if it comes back as
    # application/octet-stream.
    types {
        text/html                             html htm shtml;
        text/css                              css;
        application/javascript                js mjs;
        application/wasm                      wasm;
        application/json                      json;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/avif                            avif;
        image/x-icon                          ico;
        font/woff                             woff;
        font/woff2                            woff2;
        application/pdf                       pdf;
        video/mp4                             mp4;
        application/vnd.apple.mpegurl         m3u8;
        video/mp2t                            ts;
        text/plain                            txt;
    }
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Подробный отчёт о техническом состоянии автомобиля: схема кузова, осмотр элементов, тест-драйв и заключение специалиста."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap"
    />
    <title>Отчёт о проверке автомобиля</title>
  </head>
  <body>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0b0b0d;
        color: #e7e7ea;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-size: 14px;
        z-index: 9999;
      }
      #initial-loader .spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid rgba(231, 231, 234, 0.15);
        border-top-color: #e7e7ea;
        animation: il-spin 0.8s linear infinite;
      }
      @keyframes il-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) {
        #initial-loader { background: #fafafa; color: #18181b; }
        #initial-loader .spinner { border-color: rgba(24,24,27,0.12); border-top-color: #18181b; }
      }
    </style>
    <div id="root">
      <div id="initial-loader" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div>Загружаем отчёт…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

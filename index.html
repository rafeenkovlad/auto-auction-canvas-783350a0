<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Подробный отчёт о техническом состоянии автомобиля: схема кузова, осмотр элементов, тест-драйв и заключение специалиста."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap"
    />
    <title>Отчёт о проверке автомобиля</title>
  </head>
  <body>
    <style>
      /* Kept in sync with the in-app ReportStateCard loading visual so the
         boot splash flows seamlessly into the React-rendered preload card. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #f4f6f8;
        color: #1b2434;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      #initial-loader .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: 32rem;
        width: 100%;
        padding: 2rem;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e5e8ec;
        border-radius: 14px;
        box-shadow: 0 1px 2px rgba(20, 28, 45, 0.04), 0 4px 12px rgba(20, 28, 45, 0.03);
      }
      #initial-loader .spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(20, 28, 45, 0.1);
        border-top-color: #1b2434;
        animation: il-spin 0.8s linear infinite;
      }
      #initial-loader .title {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      @keyframes il-spin { to { transform: rotate(360deg); } }
    </style>
    <div id="root">
      <div id="initial-loader" role="status" aria-live="polite">
        <div class="card">
          <div class="spinner" aria-hidden="true"></div>
          <div class="title">Загружаем отчёт</div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
